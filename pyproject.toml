[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cod-outlier"
version = "1.1"
description = "Consistency-guided semi-supervised outlier detection in heterogeneous data"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [{name = "Baiyang Chen"}]
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
experiments = ["scikit-learn>=1.0"]

[project.urls]
Repository = "https://github.com/ChenBaiyang/COD"
Paper = "https://doi.org/10.1016/j.asoc.2024.112070"

[tool.setuptools]
packages = ["cod"]
